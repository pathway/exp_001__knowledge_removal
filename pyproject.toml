[project]
name = "tinker-knowledge-removal"
version = "0.1.0"
description = "Proof of concept: LLM unlearning hides knowledge; relearning recovers it (Tinker, Qwen3-8B)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tinker>=0.40", "torch", "transformers"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
